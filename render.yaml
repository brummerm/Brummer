# Render blueprint for the Brummer personal dashboard.
# https://render.com/docs/yaml-spec
#
# What this provisions:
#   - One web service running FastAPI (uvicorn) on Render's Starter plan
#   - One persistent disk mounted at /var/data (SQLite DB + uploaded images)
#
# Required env vars (set these in the Render dashboard, NOT in this file):
#   - AUTH_PASSWORD_HASH  : bcrypt hash of the login password
#   - JWT_SECRET          : long random string used to sign session cookies

services:
  - type: web
    name: brummer
    runtime: python
    plan: starter
    region: oregon
    rootDir: .
    buildCommand: ./build.sh
    startCommand: cd server && python run.py
    disk:
      name: brummer-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: NODE_VERSION
        value: 20.11.1
      - key: AUTH_USERNAME
        value: brummerm
      - key: SESSION_COOKIE_SECURE
        value: "true"
      - key: DATABASE_URL
        value: sqlite:////var/data/brummer.db
      - key: IMAGES_DIR
        value: /var/data/images
      # Set these in the Render dashboard:
      - key: AUTH_PASSWORD_HASH
        sync: false
      - key: JWT_SECRET
        sync: false
