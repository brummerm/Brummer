# Render blueprint for the Brummer personal dashboard.
# https://render.com/docs/yaml-spec
#
# What this provisions:
#   - One web service running FastAPI (uvicorn) on Render's free tier
#
# NOTE: Persistent disk is disabled (free tier doesn't support it). The SQLite
# DB and uploaded images live on ephemeral storage and will reset on each deploy.
# To enable persistence, upgrade the plan to Starter and restore the disk block
# and the /var/data paths for DATABASE_URL and IMAGES_DIR.
#
# Required env vars (set these in the Render dashboard, NOT in this file):
#   - AUTH_PASSWORD_HASH  : bcrypt hash of the login password
#   - JWT_SECRET          : long random string used to sign session cookies

services:
  - type: web
    name: brummer
    runtime: python
    plan: free
    region: oregon
    rootDir: .
    buildCommand: ./build.sh
    startCommand: cd server && python run.py
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: NODE_VERSION
        value: 20.11.1
      - key: AUTH_USERNAME
        value: brummerm
      - key: SESSION_COOKIE_SECURE
        value: "true"
      # Set these in the Render dashboard:
      - key: AUTH_PASSWORD_HASH
        sync: false
      - key: JWT_SECRET
        sync: false
